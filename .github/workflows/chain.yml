name: Chain

# A solution of 2.0.0 upgraded by dotskit a release at a time to 2.9.1 and to the template's sources, building
# after every step (#117); twenty minutes and a replay of releases that no longer change, so it runs on a
# schedule and on demand, not on every pull request. What every pull request keeps is the upgrade from the
# last minor of the previous major, which the Template workflow runs (UpgradeScenarios). 1.x is not supported
# (#100), so the chain starts at 2.0.0, the first release the upgrade promises.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  chain:
    name: dotskit upgrades from 2.0.0
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Git for the scenarios
        run: |
          git config --global user.name "dotskit scenarios"
          git config --global user.email "scenarios@dotskit.invalid"
      - name: Build
        run: dotnet build tool/DotsKit.Tests -warnaserror
      - name: Test
        run: dotnet test tool/DotsKit.Tests --no-build --filter "TestCategory=Chain"
