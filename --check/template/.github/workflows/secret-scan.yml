name: Secret scan

# Scans only the commits a pull request or a push brings in. Scanning the whole history on every run would
# report the same old findings each time and teach people to pass the check without reading it; to scan it
# once, run gitleaks detect --config tools/gitleaks/.gitleaks.toml locally.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  scan:
    name: Scan incoming commits
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # The range is worked out from the history, so all of it has to be here.
          fetch-depth: 0

      - name: Work out what came in
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # A branch seen for the first time has no previous commit: start where it left the default branch.
            if [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${{ github.event.repository.default_branch }}" || true
              base=$(git merge-base "$head" FETCH_HEAD 2>/dev/null || echo "")
            fi
          fi
          if [ -z "$base" ]; then
            echo "range=$head" >> "$GITHUB_OUTPUT"
          else
            echo "range=$base..$head" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect \
            --config tools/gitleaks/.gitleaks.toml \
            --log-opts="${{ steps.range.outputs.range }}" \
            --redact \
            --verbose
